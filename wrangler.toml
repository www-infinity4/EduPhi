name = "eduphi"
main = "worker/worker.js"
compatibility_date = "2024-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create with: wrangler kv namespace create EDUPHI_KV  (then paste the id)
[[kv_namespaces]]
binding = "EDUPHI_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
